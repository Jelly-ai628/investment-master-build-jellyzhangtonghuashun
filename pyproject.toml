[project]
name = "market-state-research"
version = "0.1.0"
description = "Evidence-based A-share market research: integration validation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "mcp>=1.20,<2",
    "pyarrow>=20,<30",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
